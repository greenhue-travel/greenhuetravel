<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>후기 관리 | 그린휴</title>
<style>body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#fbfaf6;color:#13261e}.w{max-width:720px;margin:0 auto;padding:20px}h1{font-size:22px}input{padding:10px;font-size:16px;width:60%}button{padding:9px 14px;font-size:15px;margin:4px 4px 0 0;border:1px solid #13261e;background:#fff;border-radius:3px}button.g{background:#13261e;color:#fff}.c{background:#fff;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}.c img{width:48%;margin:1%;aspect-ratio:4/3;object-fit:cover}.t{color:#8a6a2a;font-size:13px;font-weight:700}h2{font-size:17px;margin-top:28px;border-bottom:2px solid #13261e;padding-bottom:6px}</style></head>
<body><div class="w"><h1>사진 · 후기 관리</h1>
<p><input id="k" type="password" placeholder="관리 키"> <button class="g" onclick="save()">열기</button></p>
<div id="o"></div></div>
<script>
var K='';try{K=localStorage.getItem('ghk')||''}catch(e){}
function save(){K=document.getElementById('k').value;try{localStorage.setItem('ghk',K)}catch(e){}load()}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function card(v,pend){var ps='';for(var i=0;i<v.photos;i++)ps+='<img src="/api/img?id='+v.id+'&n='+i+'&k='+encodeURIComponent(K)+'">';
return '<div class="c"><div class="t">'+esc(v.trip)+' · '+esc(v.at.slice(0,16).replace('T',' '))+'</div><b>'+esc(v.name)+'</b><p>'+esc(v.text)+'</p>'+ps+'<div>'+(pend?'<button class="g" onclick="act(\'approve\',\''+v.key+'\')">공개</button>':'<button onclick="act(\'hide\',\''+v.key+'\')">숨기기</button>')+'<button onclick="if(confirm(\'완전히 지울까요?\'))act(\'delete\',\''+v.key+'\')">삭제</button></div></div>'}
function load(){if(!K)return;fetch('/api/admin/list',{headers:{'x-admin-key':K}}).then(function(r){return r.json()}).then(function(j){if(!j.ok){document.getElementById('o').textContent='키가 맞지 않습니다.';return}
document.getElementById('o').innerHTML='<h2>공개 대기 '+j.pending.length+'</h2>'+j.pending.map(function(v){return card(v,1)}).join('')+'<h2>공개 중 '+j.ok.length+'</h2>'+j.ok.map(function(v){return card(v,0)}).join('')})}
function act(a,key){fetch('/api/admin/act',{method:'POST',headers:{'x-admin-key':K,'content-type':'application/json'},body:JSON.stringify({action:a,key:key})}).then(load)}
load();
</script></body></html>
