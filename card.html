<style>
:root{--g:#0f241b;--iv:#f7f2e7;--gold:#d2b277;--bronze:#8a6a3a;--ink:#0f241b;--text:#3c4a42;--label:#7a6a4c;--hair:#d9cfbd;
--fd:'Cormorant Garamond','Noto Serif KR',Georgia,serif;--fs:'Noto Serif KR',Georgia,serif;--fb:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--iv);color:var(--ink);font-family:var(--fb)}
a{color:inherit;text-decoration:none}
.page{max-width:440px;margin:0 auto;min-height:100vh;background:var(--iv)}
.band{background:var(--g);height:210px;text-align:center;padding-top:28px}
.mark{font-family:var(--fd);font-weight:600;font-size:16px;letter-spacing:.28em;color:var(--iv);margin-left:.28em}
.mark b{font-family:var(--fs);font-weight:600;letter-spacing:0;color:var(--gold)}
.photo{display:block;width:156px;height:208px;margin:-136px auto 0;object-fit:cover;object-position:50% 8%;box-shadow:0 14px 32px rgba(0,0,0,.22);background:#ccc}
.id{text-align:center;padding:24px 28px 0}
h1{font-family:var(--fs);font-weight:600;font-size:30px;letter-spacing:.06em;margin:0;line-height:1.3}
.en{margin:6px 0 0;font-size:15px;color:var(--bronze)}
.en span{font-family:var(--fd);font-weight:500;font-size:18px;letter-spacing:.08em;color:var(--ink);margin-right:8px}
.rule{width:28px;height:1px;background:#b8955a;margin:20px auto}
.intro{margin:0;font-size:16px;line-height:1.6;color:var(--text)}
.ct{margin:24px 28px 0;padding:0;list-style:none;border-top:.5px solid var(--hair)}
.ct li{border-bottom:.5px solid var(--hair)}
.ct a{display:flex;justify-content:space-between;align-items:center;min-height:52px;gap:12px}
.ct em{font-style:normal;font-size:15px;color:var(--label);flex:none}
.ct strong{font-weight:500;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.ct strong.mail{font-size:16px}
.btns{margin:24px 28px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;border-radius:2px;font-family:var(--fb);cursor:pointer}
.save{grid-column:1/-1;height:56px;background:var(--g);color:var(--iv);font-size:17px;font-weight:500;letter-spacing:.04em}
.sub{height:52px;border:1px solid var(--g);background:transparent;color:var(--g);font-size:16px;font-weight:500}
.foot{margin:26px 28px 0;padding-bottom:34px;text-align:center;font-size:15px;color:#6b6a5e;line-height:1.7}
.foot a{color:var(--bronze);text-decoration:underline;text-underline-offset:3px}

<script>
(function(){
 var b=document.getElementById('shareBtn'),url='https://greenhuetravel.com/card',txt='베트남 북부 · 괌 골프, 그린휴 오선혜 대표를 소개합니다.';
 b.addEventListener('click',function(){
  if(navigator.share){navigator.share({title:'오선혜 · 그린휴 대표',text:txt,url:url}).catch(function(){});return;}
  var t=txt+' '+url;
  function ok(){b.textContent='복사됨';setTimeout(function(){b.textContent='소개하기'},2500)}
  try{navigator.clipboard.writeText(t).then(ok,function(){prompt('아래 주소를 복사해 보내 주세요',t)})}catch(e){prompt('아래 주소를 복사해 보내 주세요',t)}
 });
})();
</script>
