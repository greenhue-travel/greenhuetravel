<script>(function(){var t=new Date();t.setHours(0,0,0,0);document.querySelectorAll('[data-until]').forEach(function(e){var d=new Date(e.getAttribute('data-until')+'T00:00:00');if(t>=d)e.remove();});var g=document.querySelectorAll('.evc');if(!g.length){var ev=document.getElementById('events');if(ev)ev.remove();var st=document.getElementById('evStrip');if(st)st.remove();}})();</script>
